name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Dragonball unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source and Unity libraries
        uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build and package unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dragonball-unsigned-ipa
          path: build/Dragonball-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
